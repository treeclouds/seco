version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: ./compose/local/Dockerfile
    depends_on:
      - db
      - redis
      - mailer
      - vllm
    networks:
      - db
      - redis
      - mailer
      - vllm
    ports:
      - "5150:5150"
    volumes:
      - .:/app
      - cargo-target:/app/target
    env_file:
      - .env
    environment:
      - VLLM_URL=http://vllm:8000/v1/chat/completions
    tty: true

  vllm:
    image: public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:latest
    command: >
      --model Qwen/Qwen3.5-0.8B
      --device cpu
      --dtype bfloat16
      --port 8000
      --max-model-len 2048
      --disable-log-requests
    ports:
      - "8000:8000"
    networks:
      - vllm
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - VLLM_LOGGING_LEVEL=WARNING
    restart: unless-stopped
    shm_size: "4gb"
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp=unconfined

  db:
    image: postgres:17.4-bookworm
    restart: unless-stopped
    ports:
      - "5433:5432"
    networks:
      - db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - .env

  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - redis

  mailer:
    image: mailtutan/mailtutan:latest
    restart: unless-stopped
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - mailer

volumes:
  postgres-data: {}
  cargo-target: {}
  huggingface-cache: {}

networks:
  db:
  redis:
  mailer:
  vllm:
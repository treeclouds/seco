#      - production_traefik:/etc/traefik/acme:z
#    ports:
#      - "0.0.0.0:80:80"
#      - "0.0.0.0:443:443"

volumes:
  postgres-data: {}
  cargo-target: {}
  huggingface-cache: {}

networks:
  db:
  redis:
  vllm:

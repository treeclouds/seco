version: "3.8"

services:
  db:
    image: postgres:17.4-bookworm
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: ./compose/production/Dockerfile
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - vllm
    ports:
      - "5150:5150"
    volumes:
      - .:/app
      - cargo-target:/app/target
    environment:
      - VLLM_URL=http://vllm:8000/v1/chat/completions
    restart: unless-stopped

  vllm:
    image: public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:latest
    command: >
      --model Qwen/Qwen3.5-0.8B
      --device cpu
      --dtype bfloat16
      --port 8000
      --max-model-len 2048
      --disable-log-requests
    ports:
      - "8000:8000"
    networks:
      - vllm
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - VLLM_LOGGING_LEVEL=WARNING
    restart: unless-stopped
    shm_size: "4gb"
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp=unconfined

  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - redis

#  traefik:
